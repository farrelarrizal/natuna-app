version: "3.8"

services:
    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
        image: natuna/app
        container_name: natuna-app
        ports:
            - "${APP_PORT:-80}:80"
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            APP_ENV: staging
            LARAVEL_SAIL: 1
        volumes:
            - ./app:/var/www/html
        networks:
            - sail

    mysql:
        image: mysql:8.0
        container_name: natuna-db
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    natuna:
        driver: local
