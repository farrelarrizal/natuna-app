version: "3"

networks:
    application:
        driver: bridge

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: natuna-app
        ports:
            - 8000:8000
        volumes:
            - .:/app
        env_file:
            - .env
        networks:
            - application
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                composer install
                php artisan migrate
                php artisan serve --host=0.0.0.0 --port=8000
